name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations: { required: true }
  - type: input
    id: macos
    attributes: { label: macOS version, placeholder: "macOS 26.1" }
    validations: { required: true }
  - type: input
    id: mac
    attributes: { label: Mac, placeholder: "MacBook Pro M3" }
  - type: input
    id: version
    attributes: { label: Framecast version, placeholder: "0.1.0" }
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or a short recording
      description: Drag files here if they help explain the problem.
