name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: extra
    attributes:
      label: Anything else? Screenshots, sketches or examples from other apps.
